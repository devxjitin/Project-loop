name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://loop:loop_local_password@localhost:5432/loop
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: loop
          POSTGRES_USER: loop
          POSTGRES_PASSWORD: loop_local_password
        options: >-
          --health-cmd "pg_isready -U loop -d loop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run migrate
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install AI service test tooling
        run: python -m pip install -r apps/ai-service/requirements.txt ruff mypy
      - name: Lint AI service
        run: ruff check apps/ai-service
      - name: Type-check AI service
        run: mypy --config-file apps/ai-service/pyproject.toml apps/ai-service/app
      - name: Test AI service
        run: python -m unittest discover -s apps/ai-service/tests -v
