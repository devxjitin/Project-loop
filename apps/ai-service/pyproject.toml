[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness linting; formatting is deliberately kept separate from CI.
select = ["F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false

[[tool.mypy.overrides]]
module = "hdbscan"
ignore_missing_imports = true
